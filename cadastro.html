<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Cadastro</title>
        <style>
            @import url(Stylesheet.css);
        </style>
    </head>
    <body>
        <header>
            <a href="index.html"><img src="imagens/super-show-supermercado-seeklogo.png" alt="Logo Super Show Supermercados" class="Logo"></a>
            <h1>Super Show Supermercados</h1>
        </header>
        <main>
            <section id="cadastro">
                
                <form action="index.html">
                    <a href="login.html" id="login-link">já sou cliente &#8594</a>
                    <h2>Cadastre-se</h2>
                    <label for="nomeCadastro">Nome: </label><br>
                    <input type="text" name="nome" id="nomeCadastro" required><br>
                    <label for="emailCadastro">E-mail: </label><br>
                    <input type="email" name="email" id="emailCadastro" placeholder="email@exemplo.com" required><br>
                    <label for="senha">Senha:</label><br>
                    <input type="password" name="senha" id="senha" minlength="8" required><br>
                    <label for="senhaConfirmacao">Confirmação Senha: </label><br>
                    <input type="password" name="senhaConfirmacao" id="senhaConfirmacao" minlength="8" required><br>
                    <label for="cpf">CPF: </label><br>
                    <input type="text" name="cpf" id="cpf" placeholder="000.000.000-00" pattern="\d{3}\.?\d{3}\.?\d{3}-?\d{2}" title="CPF" required><br>
                    <div id="cadastrar">
                        <input type="submit" name="Cadatrar" value="Cadatrar" id="botao-cadastrar">
                    </div>
                </form>
            </section>
        </main>
    </body>
</html>
